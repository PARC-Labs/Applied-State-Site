name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and public-build checks
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://parc-labs.github.io
      BASE_PATH: /Applied-State-Site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build the static site
        run: npm run build
      - name: Verify the public artifact
        run: npm run test:leakage

  database:
    name: Supabase migrations, lint, and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Start a clean local database and apply migrations
        run: supabase db start
      - name: Lint the local database
        run: supabase db lint --local --level warning --fail-on warning
      - name: Run pgTAP authorization tests
        run: supabase test db
      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup
